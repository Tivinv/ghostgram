# Prepared for Ghostgram 2a6b08272b7da893f88986846022bafd0727df89.
# First cloud build still required; this workflow has not been run on macOS.
workflows:
  ghostgram-altstore:
    name: Ghostgram IPA for AltStore
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "27.1"
      groups:
        - ghostgram
    cache:
      cache_paths:
        - ~/telegram-bazel-cache
    scripts:
      - name: Check Xcode and API credentials
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          required = json.load(open('versions.json'))['xcode']
          actual = subprocess.check_output(['xcodebuild', '-version'], text=True)
          print(actual)
          version = re.search(r'Xcode (\S+)', actual).group(1)
          def parts(v): return tuple(map(int, v.split('.')))
          if parts(version) < parts(required):
              raise SystemExit(f'Ghostgram requires Xcode {required} or newer; choose a suitable Codemagic image.')
          api_id = os.environ.get('TELEGRAM_API_ID', '')
          api_hash = os.environ.get('TELEGRAM_API_HASH', '')
          if not api_id.isdigit() or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Set TELEGRAM_API_ID and TELEGRAM_API_HASH in the ghostgram environment group.')
          config = json.load(open('build-system/ghostgram-configuration.example.json'))
          config.update(api_id=api_id, api_hash=api_hash, team_id='AAAAAAAAAA')
          # Placeholder team: no Apple signing is performed here. AltStore re-signs the IPA.
          with open('build-system/ghostgram-configuration.json', 'w') as f:
              json.dump(config, f)
          PY
      - name: Install Metal Toolchain
        script: |
          set -euo pipefail
          # Since Xcode 26 the Metal compiler is a separate download, and the
          # Codemagic image does not ship it: MetalCompile (CameraNeo.metal) fails with
          # "cannot execute tool 'metal' due to missing Metal Toolchain".
          # A plain download can finish ("Done downloading") and still leave the toolchain
          # unregistered, so export the bundle and import it explicitly, then wait for it.
          metal_ok() { xcrun metal --version >/dev/null 2>&1; }
          if ! metal_ok; then
            EXPORT_DIR="$(mktemp -d)"
            xcodebuild -downloadComponent MetalToolchain -exportPath "$EXPORT_DIR"
            for bundle in "$EXPORT_DIR"/*.exportedBundle; do
              xcodebuild -importComponent metalToolchain -importPath "$bundle"
            done
            for attempt in 1 2 3 4 5 6; do
              metal_ok && break
              echo "Metal Toolchain not usable yet (attempt $attempt), waiting..."
              sleep 10
            done
          fi
          if ! metal_ok; then
            xcodebuild -showComponent MetalToolchain || true
            xcode-select -p
            xcrun metal --version
          fi
          xcrun metal --version
      - name: Initialize submodules and project patches
        script: |
          set -euo pipefail
          git submodule update --init --recursive --jobs 8
          GG_PATCHES_ONLY=1 bash build-system/GGBuild.sh
          # rules_apple embeds profiles unconditionally even with signing disabled.
          # Scope the adjustment to this unsigned AltStore workflow checkout.
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('build-system/bazel-rules/rules_apple/apple/internal/ios_rules.bzl')
          source = path.read_text()
          pattern = r'(    if platform_prerequisites.platform.is_device)(:\n        processor_partials.append\(\n            partials.provisioning_profile_partial\()'
          source, count = re.subn(pattern, r'\1 and "disable_legacy_signing" not in ctx.features\2', source)
          if count != 6:
              raise SystemExit(f'Unexpected rules_apple layout: {count} profile embedding blocks; expected 6.')
          path.write_text(source)
          PY
          printf '\nbuild --//Telegram:disableProvisioningProfiles=true\nbuild --features=disable_legacy_signing\n' >> .bazelrc
      - name: Build unsigned device IPA
        script: |
          set -euo pipefail
          mkdir -p build-output/ipa
          python3 build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" build \
            --configurationPath build-system/ghostgram-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber="${BUILD_NUMBER:-1}" --configuration=release_arm64 \
            --outputBuildArtifactsPath build-output/ipa \
            2>&1 | tee build-output/build.log
          test -s build-output/ipa/Telegram.ipa
          mv build-output/ipa/Telegram.ipa build-output/ipa/Ghostgram-AltStore.ipa
          unzip -tq build-output/ipa/Ghostgram-AltStore.ipa
    artifacts:
      - build-output/ipa/Ghostgram-AltStore.ipa
      - build-output/build.log

